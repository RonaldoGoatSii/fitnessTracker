<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <title>Fitness Tracker</title>
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <img src="img/fit.png" alt="Logo" class="logo-img">
            <div class="logo-text">FITNESS<span>TRACKER</span></div>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">HOME</a></li>
            <li id="nav-workout-li" style="display: none;"><a href="src/workouts/treinos.html">WORKOUTS</a></li>
            <li id="nav-list-li" style="display: none;"><a href="src/workouts/list.html">LIST</a></li>
            <li id="nav-login-li"><a href="src/users/login.html">LOGIN</a></li>
            <li id="nav-logout-li" style="display: none;"><a href="#" onclick="logout()">LOGOUT</a></li>
        </ul>
    </nav>

    <main class="hero">
        <section class="highlights">
            <h2>Why FitnessTracker?</h2>
            <div class="highlight-grid">
                <highlight-card
                    title="Custom Workouts"
                    description="Create routines tailored to your goals.">
                </highlight-card>

                <highlight-card
                    title="Track Progress"
                    description="Monitor your evolution over time.">
                </highlight-card>

                <highlight-card
                    title="Stay Motivated"
                    description="Stay consistent and challenge yourself.">
                </highlight-card>
            </div>
        </section>

        <section class="how-it-works">
            <h2>How It Works</h2>
            <div class="steps-grid">
                <step-card number="1" title="Create Your Workout"
                    description="Choose a name and start building your routine.">
                </step-card>

                <step-card number="2" title="Add Exercises"
                    description="Select exercises from our library and customize reps & sets.">
                </step-card>

                <step-card number="3" title="Track & Improve"
                    description="Follow your progress and stay consistent.">
                </step-card>
            </div>
        </section>

        <section class="testimonials-carousel">
            <h2>User's Feedback</h2>
            <div class="carousel-auto">
                <div class="carousel-track-auto">
                    <testimonial-card quote="FitnessTracker helped me stay consistent and organized. Love it!" author="Ana, 24"></testimonial-card>
                    <testimonial-card quote="Finally a clean and simple way to manage my workouts." author="João, 31"></testimonial-card>
                    <testimonial-card quote="I improved my routine and motivation thanks to this platform." author="Marta, 28"></testimonial-card>
                    <testimonial-card quote="The best tool I've used to track my training evolution." author="Ricardo, 29"></testimonial-card>
                    <testimonial-card quote="FitnessTracker helped me stay consistent and organized. Love it!" author="Ana, 24"></testimonial-card>
                    <testimonial-card quote="Finally a clean and simple way to manage my workouts." author="João, 31"></testimonial-card>
                </div>
            </div>
        </section>
    </main>

    <script>

        class HighlightCard extends HTMLElement {
            connectedCallback() {
                const title = this.getAttribute('title');
                const desc  = this.getAttribute('description');

                this.classList.add('highlight-card');
                this.innerHTML = `
                    <h3>${title}</h3>
                    <p>${desc}</p>
                `;
            }
        }
        customElements.define('highlight-card', HighlightCard);

        class StepCard extends HTMLElement {
            connectedCallback() {
                const number = this.getAttribute('number');
                const title  = this.getAttribute('title');
                const desc   = this.getAttribute('description');

                this.classList.add('step-card');
                this.innerHTML = `
                    <span>${number}</span>
                    <h3>${title}</h3>
                    <p>${desc}</p>
                `;
            }
        }
        customElements.define('step-card', StepCard);

      
        class TestimonialCard extends HTMLElement {
            connectedCallback() {
                const quote  = this.getAttribute('quote');
                const author = this.getAttribute('author');

                this.classList.add('carousel-item-auto');
                this.innerHTML = `
                    <p>"${quote}"</p>
                    <h4>- ${author}</h4>
                `;
            }
        }
        customElements.define('testimonial-card', TestimonialCard);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="src/workouts/index.js"></script>
</body>
</html>
